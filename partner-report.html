<!--
  This page used to be the referral dashboard. It has been replaced by /admin/,
  which reads the same log plus the outbound-click events, and — the reason for
  the move — checks a real password server-side.

  What was here before could not: it gated the data on
  FEELBG_REFERRAL_DASHBOARD_KEY, a constant sitting in js/referral-config.js,
  which every visitor downloads. Anyone who opened devtools could read the whole
  referral log. /admin/ keeps the password, the Sheets URL and its key in
  environment variables that never reach the browser.

  Kept as a redirect rather than deleted because this URL may have been shared.
-->
